name: Update chart

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET search/issues --paginate --slurp -f q='author:IHAGI-c type:pr is:merged -user:IHAGI-c -org:iesg-stuff' -f per_page=100 > prs.json
          python3 .github/scripts/chart.py prs.json assets/chart.svg
          rm -f prs.json

      - name: Commit
        run: |
          git add assets/chart.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update chart"
          git push
