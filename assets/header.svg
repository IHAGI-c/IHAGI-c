<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Haseom Shin. A LangGraph graph that turns an issue into a merged pull request.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#12101c"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a78bfa" fill-opacity="0.12"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#a78bfa" fill-opacity="0.8"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L10 5L0 9z" fill="#f0abfc" fill-opacity="0.8"/></marker>
<clipPath id="c"><rect width="900" height="300" rx="10"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="900" height="300" fill="url(#bg)"/><rect width="900" height="300" fill="url(#dots)"/></g>
<rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="none" stroke="#a78bfa" stroke-opacity="0.25"/>
<g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace">
<text x="36" y="52" font-size="22" letter-spacing="6" font-weight="300" fill="#f1ecff">HASEOM SHIN</text>
<text x="36" y="76" font-size="12" letter-spacing="2" fill="#9b93b8">LLM agents / document rendering / open source</text>
<g stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1.5" fill="none">
<line x1="82" y1="190" x2="120" y2="190" marker-end="url(#ar)"/>
<line x1="250" y1="190" x2="300" y2="190" marker-end="url(#ar)"/>
<line x1="430" y1="190" x2="480" y2="190" marker-end="url(#ar)"/>
<line x1="610" y1="190" x2="660" y2="190" marker-end="url(#ar)"/>
<line x1="790" y1="190" x2="828" y2="190" marker-end="url(#ar)"/>
</g>
<path d="M545 168 C545 100 365 100 365 166" fill="none" stroke="#f0abfc" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ar2)"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/></path>
<text x="455" y="104" font-size="11" text-anchor="middle" fill="#f0abfc" fill-opacity="0.9">changes_requested</text>
<circle cx="60" cy="190" r="22" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.8"/>
<text x="60" y="194" font-size="10" text-anchor="middle" fill="#d9ccff">START</text>
<circle cx="850" cy="190" r="22" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.8"/>
<text x="850" y="194" font-size="10" text-anchor="middle" fill="#d9ccff">END</text>
<circle r="5" fill="#f0abfc"><animateMotion dur="9.0s" repeatCount="indefinite" path="M60 190 H850" keyTimes="0;1" calcMode="linear"/></circle>
<circle r="11" fill="#f0abfc" fill-opacity="0.18"><animateMotion dur="9.0s" repeatCount="indefinite" path="M60 190 H850" keyTimes="0;1" calcMode="linear"/></circle>
<rect x="120" y="168" width="130" height="44" rx="8" fill="#a78bfa" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.28;0.28;1;0.28;0.28" keyTimes="0;0.088;0.158;0.248;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.03;0.03;0.22;0.03;0.03" keyTimes="0;0.088;0.158;0.248;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="185" y="195" font-size="14" text-anchor="middle" fill="#f1ecff">read_issue</text><rect x="300" y="168" width="130" height="44" rx="8" fill="#a78bfa" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.28;0.28;1;0.28;0.28" keyTimes="0;0.316;0.386;0.476;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.03;0.03;0.22;0.03;0.03" keyTimes="0;0.316;0.386;0.476;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="365" y="195" font-size="14" text-anchor="middle" fill="#f1ecff">render</text><rect x="480" y="168" width="130" height="44" rx="8" fill="#a78bfa" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.28;0.28;1;0.28;0.28" keyTimes="0;0.544;0.614;0.704;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.03;0.03;0.22;0.03;0.03" keyTimes="0;0.544;0.614;0.704;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="545" y="195" font-size="14" text-anchor="middle" fill="#f1ecff">open_pr</text><rect x="660" y="168" width="130" height="44" rx="8" fill="#a78bfa" fill-opacity="0.03" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.28;0.28;1;0.28;0.28" keyTimes="0;0.772;0.842;0.932;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.03;0.03;0.22;0.03;0.03" keyTimes="0;0.772;0.842;0.932;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="725" y="195" font-size="14" text-anchor="middle" fill="#f1ecff">merged</text><text x="36" y="262" font-size="13" fill="#9b93b8">&gt; graph.invoke(issue)</text>
<text x="36" y="282" font-size="13" fill="#d9ccff">  # returns a merged pull request. usually on the second pass.</text>
</g>
</svg>
