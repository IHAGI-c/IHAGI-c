<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Haseom Shin. LLM agents, open source.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d13"/>
      <stop offset="1" stop-color="#0e1620"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#4de2ff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="clip">
      <rect width="900" height="240" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="239" rx="6" fill="none" stroke="#4de2ff" stroke-opacity="0.22"/>

  <g fill="none" stroke="#4de2ff" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M14 34V14H34"/>
    <path d="M866 14H886V34"/>
    <path d="M14 206V226H34"/>
    <path d="M866 226H886V206"/>
  </g>

  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <circle cx="52" cy="62" r="3" fill="#4de2ff"/>
    <text x="66" y="66" font-size="11" letter-spacing="4" fill="#4de2ff" fill-opacity="0.85">SYSTEM ONLINE</text>

    <text x="48" y="122" font-size="44" font-weight="300" letter-spacing="8" fill="#e9f7fb">HASEOM SHIN</text>

    <line x1="50" y1="144" x2="420" y2="144" stroke="#4de2ff" stroke-opacity="0.35"/>

    <text x="50" y="172" font-size="13" letter-spacing="3" fill="#8ba5b1">LLM  /  AGENTS  /  OPEN SOURCE</text>

    <text x="50" y="206" font-size="13" letter-spacing="1" fill="#4de2ff" fill-opacity="0.75">&gt; standing by</text>
  </g>

  <g transform="translate(730 120)" fill="none" stroke="#4de2ff">
    <line x1="-112" y1="0" x2="112" y2="0" stroke-opacity="0.12"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke-opacity="0.12"/>

    <circle r="100" stroke-opacity="0.35" stroke-dasharray="1 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" stroke-opacity="0.28" stroke-dasharray="40 12 4 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle r="62" stroke-opacity="0.45"/>
    <circle r="44" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="70 26">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" stroke-opacity="0.25"/>
    <circle r="4" fill="#4de2ff" stroke="none" fill-opacity="0.85"/>
  </g>
</svg>
